[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "taxorec"
version = "0.2.0"
description = "Reproducible taxonomy construction (TaxoGen vs. SBERT+HDBSCAN+BM25-cosine) and taxonomy-guided recommendation experiments"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
nlp = ["sentence-transformers>=2.2", "gensim>=4.3", "spacy>=3.5", "umap-learn>=0.5"]
stats = ["statsmodels>=0.14"]
bertopic = ["bertopic>=0.16"]
test = ["pytest>=7"]

[project.scripts]
taxorec = "taxorec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
